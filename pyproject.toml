[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-mvc"
version = "1.0.0a2"
description = "A simple, fast, and modern Python web framework."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aurora MVC Team" }
]
dependencies = [
    "Jinja2>=3.1",
    "SQLAlchemy>=2.0",
]

[project.urls]
Homepage = "https://auroramvc.com"
Repository = "https://github.com/sigmascript/aurora-mvc"

[project.optional-dependencies]
mysql = [
    "PyMySQL>=1.1,<2",
]
dev = [
    "uvicorn>=0.30",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*"]
