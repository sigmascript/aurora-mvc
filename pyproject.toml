[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-mvc"
version = "1.0.0a7"
description = "A simple, fast, and modern Python web framework."
readme = {file = "README.pypi.md", content-type = "text/markdown"}
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Aurora MVC Team" }
]
dependencies = [
    "Jinja2>=3.1",
]

[project.urls]
Homepage = "https://auroramvc.com"
Repository = "https://github.com/sigmascript/aurora-mvc"

[project.optional-dependencies]
mysql = [
    "PyMySQL>=1.1,<2",
]
postgresql = [
    "psycopg>=3.1,<4",
]
dev = [
    "uvicorn>=0.30",
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*"]
